<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <title>Random Person Api</title>
</head>

<body>
  <main class="container">
    <h1>Persona aleatoria</h1>
    <article>
      <header>Datos obtenidos de Random User API</header>
      <img id="photo" src="https://randomuser.me/api/portraits/men/0.jpg" alt="Foto de la persona aleatoria">
      <dl>
        <dt>Nombre</dt>
        <dd id="first">Robert</dd>
        <dt>Apellidos</dt>
        <dd id="last">Anderson</dd>
        <dt>País</dt>
        <dd id="country">Somewhere warm</dd>
        <dt>Teléfono</dt>
        <dd id="phone">123-456-789</dd>
        <dt>Email</dt>
        <dd id="email"></dd>
      </dl>
      <footer>
        <button type="button" id="btn">Obtener nueva persona</button>
      </footer>
    </article>
  </main>

  <script src="app.js"></script>
</body>

</html>
